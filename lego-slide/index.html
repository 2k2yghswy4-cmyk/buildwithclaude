<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomy of Success</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
  .slide{position:relative;width:1280px;height:720px;background:linear-gradient(180deg,#e6f5fd,#cfe9f7);overflow:hidden;border-radius:6px}
  .strip{position:absolute;top:0;left:0;right:0;height:26px;background:#c9d82b;
    background-image:radial-gradient(circle at 14px 13px,#e6ef6a 7px,transparent 8px);background-size:28px 26px}
  .title{position:absolute;top:70px;left:0;right:0;text-align:center;font-weight:900;font-size:50px;color:#4a2f27;letter-spacing:-1px}
  .title b{color:#d2261c}
  .sub{position:absolute;top:132px;left:0;right:0;text-align:center;font-size:24px;font-weight:700;color:#4a2f27}
  .card{position:absolute;top:225px;width:210px;height:340px;border-radius:18px;text-align:center;padding-top:34px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
  .card:before{content:"";position:absolute;top:-22px;left:22px;width:40px;height:26px;border-radius:8px 8px 0 0;background:inherit;box-shadow:68px 0 0 0 currentColor,0 0 0 0 transparent}
  .stud{position:absolute;top:-20px;width:44px;height:24px;border-radius:10px 10px 0 0;background:inherit}
  .card h2{font-size:34px;font-weight:900;margin-top:6px}
  .card p{font-size:21px;font-weight:600;line-height:1.25;margin:10px auto 0;width:160px}
  .c1{left:432px;background:#e6d62a;color:#4a2f27}
  .c2{left:664px;background:#e0431f}
  .c3{left:896px;background:#5a3fd1}
  .c1 .stud:nth-child(1){left:20px}.c1 .stud:nth-child(2){left:83px}.c1 .stud:nth-child(3){left:146px}
  .c2 .stud:nth-child(1){left:20px}.c2 .stud:nth-child(2){left:83px}.c2 .stud:nth-child(3){left:146px}
  .c3 .stud:nth-child(1){left:20px}.c3 .stud:nth-child(2){left:83px}.c3 .stud:nth-child(3){left:146px}
  .card:before{display:none}
  .card svg{position:absolute;left:0;bottom:8px;width:100%;height:112px}
  .card p{font-size:20px}
  .banner{position:absolute;left:432px;width:674px;top:612px;height:48px;border-radius:24px;background:#f4e04a;border:3px solid #fff;
    text-align:center;line-height:42px;font-weight:900;font-size:22px;color:#6b3a14;box-shadow:0 3px 0 rgba(0,0,0,.15)}
  .progress{position:absolute;left:60px;right:90px;bottom:34px;height:4px;background:#bcd6e6;border-radius:2px}
  .progress i{position:absolute;left:0;top:0;height:4px;width:36%;background:#e0431f;border-radius:2px}
  .num{position:absolute;right:48px;bottom:24px;font-weight:800;font-size:15px;color:#4a2f27}
  .fig{position:absolute;left:36px;top:210px;width:380px;height:460px}
  .bricks{position:absolute;right:50px;top:70px;width:120px;height:90px}
</style>
</head>
<body>
<div class="slide">
  <div class="strip"></div>

  <div class="title">The Anatomy of <b>LEGO’s</b> Success</div>
  <div class="sub">From the Interlocking System to Global Production</div>

  <!-- decorative bricks -->
  <svg class="bricks" viewBox="0 0 120 90">
    <g transform="translate(6,22)">
      <rect x="0" y="14" width="62" height="38" rx="5" fill="#d2261c"/>
      <polygon points="0,14 62,14 72,4 10,4" fill="#ee5a4a"/>
      <ellipse cx="22" cy="9" rx="9" ry="5" fill="#ee5a4a"/><ellipse cx="50" cy="9" rx="9" ry="5" fill="#ee5a4a"/>
      <rect x="62" y="14" width="10" height="38" fill="#a51a12" transform="skewY(-45) translate(0,36)" opacity="0"/>
    </g>
    <g transform="translate(46,2)">
      <rect x="0" y="26" width="58" height="36" rx="5" fill="#9bc72b"/>
      <polygon points="0,26 58,26 66,16 8,16" fill="#c5e35a"/>
      <ellipse cx="20" cy="20" rx="8" ry="5" fill="#c5e35a"/><ellipse cx="46" cy="20" rx="8" ry="5" fill="#c5e35a"/>
    </g>
  </svg>

  <!-- minifigure + brick diagram -->
  <svg class="fig" viewBox="0 0 420 460" style="width:420px;left:10px">
    <!-- sparkle lines -->
    <g stroke="#f2b705" stroke-width="5" stroke-linecap="round">
      <line x1="170" y1="40" x2="162" y2="22"/><line x1="190" y1="34" x2="196" y2="16"/><line x1="150" y1="58" x2="136" y2="48"/>
    </g>
    <!-- anatomy circle -->
<g transform="translate(40,0)">
    <circle cx="255" cy="350" r="92" fill="#fff" stroke="#f2b705" stroke-width="5"/>
    <g transform="translate(190,300)">
      <!-- upper brick (outline) -->
      <polygon points="10,36 112,36 128,18 28,18" fill="#eef1f3" stroke="#aeb8bf" stroke-width="2"/>
      <ellipse cx="42" cy="26" rx="13" ry="5" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
      <ellipse cx="70" cy="26" rx="13" ry="5" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
      <ellipse cx="98" cy="26" rx="13" ry="5" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
      <!-- lower brick -->
      <polygon points="0,66 118,66 134,48 18,48" fill="#e4e8eb" stroke="#aeb8bf" stroke-width="2"/>
      <rect x="0" y="66" width="118" height="30" fill="#f4f6f7" stroke="#aeb8bf" stroke-width="2"/>
      <polygon points="118,66 134,48 134,78 118,96" fill="#d5dbe0" stroke="#aeb8bf" stroke-width="2"/>
      <ellipse cx="34" cy="57" rx="11" ry="4" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
      <ellipse cx="62" cy="57" rx="11" ry="4" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
      <ellipse cx="90" cy="57" rx="11" ry="4" fill="#fff" stroke="#aeb8bf" stroke-width="2"/>
    </g>
    <text x="222" y="296" font-size="15" font-weight="700" fill="#3a3a3a">Tube</text>
    <line x1="244" y1="302" x2="238" y2="322" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="292" y="414" font-size="15" font-weight="700" fill="#3a3a3a">Stud</text>
    <line x1="296" y1="404" x2="262" y2="360" stroke="#3a3a3a" stroke-width="1.5"/>
</g>

    <!-- minifigure -->
    <!-- legs -->
    <rect x="62" y="372" width="56" height="78" rx="6" fill="#f08a1c"/>
    <rect x="124" y="372" width="56" height="78" rx="6" fill="#f08a1c"/>
    <rect x="118" y="372" width="6" height="78" fill="#c76d0d"/>
    <!-- torso -->
    <rect x="48" y="226" width="146" height="150" rx="14" fill="#f1f6fa" stroke="#cfd9e0" stroke-width="2"/>
    <!-- apron -->
    <path d="M70 250 L172 250 L180 376 L62 376 Z" fill="#f08a1c"/>
    <path d="M70 250 L104 226 L138 226 L172 250 Z" fill="#f08a1c" opacity="0"/>
    <rect x="76" y="296" width="90" height="38" rx="6" fill="#fff"/>
    <text x="121" y="322" font-size="22" font-weight="900" text-anchor="middle" fill="#d2261c" font-family="Arial Black,Arial,sans-serif">BRICK</text>
    <!-- left arm (viewer's left) -->
    <rect x="14" y="238" width="38" height="104" rx="16" fill="#f1f6fa" stroke="#cfd9e0" stroke-width="2"/>
    <circle cx="33" cy="350" r="15" fill="#f6c21c"/>
    <!-- right arm raised holding brick -->
    <g transform="rotate(-28 190 250)">
      <rect x="188" y="204" width="38" height="96" rx="16" fill="#f1f6fa" stroke="#cfd9e0" stroke-width="2"/>
    </g>
    <circle cx="238" cy="196" r="15" fill="#f6c21c"/>
    <!-- red brick held -->
    <g transform="translate(222,128) rotate(-12)">
      <polygon points="0,40 98,40 112,24 14,24" fill="#ee5a4a"/>
      <rect x="0" y="40" width="98" height="40" rx="3" fill="#d2261c"/>
      <polygon points="98,40 112,24 112,64 98,80" fill="#a51a12"/>
      <ellipse cx="26" cy="32" rx="11" ry="4.5" fill="#ee5a4a"/><ellipse cx="56" cy="32" rx="11" ry="4.5" fill="#ee5a4a"/><ellipse cx="86" cy="32" rx="11" ry="4.5" fill="#ee5a4a"/>
    </g>
    <!-- neck + head -->
    <rect x="96" y="208" width="52" height="24" rx="6" fill="#f6c21c"/>
    <!-- ponytail -->
    <path d="M44 120 C10 130 6 190 36 228 C20 190 34 160 58 150 Z" fill="#8a4a24"/>
    <!-- head -->
    <rect x="60" y="86" width="124" height="124" rx="38" fill="#f6c21c"/>
    <!-- hair top -->
    <path d="M52 140 C46 70 100 52 146 66 C186 78 196 120 190 150 C176 112 138 100 104 106 C84 110 62 122 52 140 Z" fill="#8a4a24"/>
    <path d="M60 130 C70 112 92 104 112 102" stroke="#a65d2f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- face -->
    <circle cx="100" cy="150" r="7" fill="#3b2418"/><circle cx="144" cy="150" r="7" fill="#3b2418"/>
    <circle cx="102" cy="148" r="2" fill="#fff"/><circle cx="146" cy="148" r="2" fill="#fff"/>
    <path d="M96 176 Q122 198 150 176" stroke="#3b2418" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M100 178 Q122 194 146 178 Z" fill="#fff"/>
    <g fill="#d9902a"><circle cx="90" cy="168" r="2"/><circle cx="98" cy="172" r="2"/><circle cx="150" cy="168" r="2"/><circle cx="158" cy="172" r="2"/></g>
  </svg>

  <!-- cards -->
  <div class="card c1">
    <i class="stud"></i><i class="stud"></i><i class="stud"></i>
    <h2>Quality</h2><p>Precision and reliable fit</p>
    <svg viewBox="0 0 210 140">
      <g transform="translate(28,34)">
        <polygon points="0,30 90,30 104,16 14,16" fill="#f08a1c"/>
        <rect x="0" y="30" width="90" height="46" rx="4" fill="#e0431f"/>
        <polygon points="90,30 104,16 104,62 90,76" fill="#b5300f"/>
        <ellipse cx="24" cy="23" rx="10" ry="4" fill="#f08a1c"/><ellipse cx="52" cy="23" rx="10" ry="4" fill="#f08a1c"/><ellipse cx="80" cy="23" rx="10" ry="4" fill="#f08a1c"/>
      </g>
      <g transform="translate(66,62)">
        <polygon points="0,30 90,30 104,16 14,16" fill="#6a63e6"/>
        <rect x="0" y="30" width="90" height="46" rx="4" fill="#4a3fd0"/>
        <polygon points="90,30 104,16 104,62 90,76" fill="#3329a0"/>
        <ellipse cx="24" cy="23" rx="10" ry="4" fill="#6a63e6"/><ellipse cx="52" cy="23" rx="10" ry="4" fill="#6a63e6"/><ellipse cx="80" cy="23" rx="10" ry="4" fill="#6a63e6"/>
      </g>
    </svg>
  </div>

  <div class="card c2">
    <i class="stud"></i><i class="stud"></i><i class="stud"></i>
    <h2>Durability</h2><p>Compatibility across generations</p>
    <svg viewBox="0 0 210 140">
      <!-- castle -->
      <rect x="30" y="100" width="150" height="26" rx="6" fill="#7bb33a"/>
      <rect x="62" y="56" width="86" height="56" fill="#d7d8da"/>
      <rect x="42" y="46" width="30" height="66" fill="#c3c5c8"/>
      <rect x="138" y="46" width="30" height="66" fill="#c3c5c8"/>
      <g fill="#c3c5c8"><rect x="42" y="38" width="8" height="10"/><rect x="54" y="38" width="8" height="10"/><rect x="66" y="38" width="6" height="10"/>
        <rect x="138" y="38" width="8" height="10"/><rect x="150" y="38" width="8" height="10"/><rect x="162" y="38" width="6" height="10"/></g>
      <g fill="#d7d8da"><rect x="68" y="48" width="10" height="10"/><rect x="84" y="48" width="10" height="10"/><rect x="100" y="48" width="10" height="10"/><rect x="116" y="48" width="10" height="10"/><rect x="132" y="48" width="8" height="10"/></g>
      <path d="M93 112 V88 a12 12 0 0 1 24 0 V112 Z" fill="#8a5a2b"/>
      <rect x="52" y="64" width="8" height="14" rx="4" fill="#5a6168"/><rect x="150" y="64" width="8" height="14" rx="4" fill="#5a6168"/>
      <line x1="105" y1="46" x2="105" y2="22" stroke="#6b4a2b" stroke-width="3"/>
      <polygon points="105,22 128,29 105,36" fill="#f2c21c"/>
    </svg>
  </div>

  <div class="card c3">
    <i class="stud"></i><i class="stud"></i><i class="stud"></i>
    <h2>Safety</h2><p>Strict standards for children</p>
    <svg viewBox="0 0 210 140">
      <path d="M105 14 L158 32 V74 C158 104 134 122 105 132 C76 122 52 104 52 74 V32 Z" fill="#f4b81c" stroke="#fff3b0" stroke-width="3"/>
      <path d="M105 26 L148 40 V74 C148 98 128 113 105 122 C82 113 62 98 62 74 V40 Z" fill="#fbd24c"/>
      <path d="M82 76 L98 92 L130 56" stroke="#5b4a3a" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="banner">The product promise cannot be traded away.</div>

  <div class="progress"><i></i></div>
  <div class="num">05</div>
</div>
</body>
</html>
