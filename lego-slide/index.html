  *{box-sizing:border-box;margin:0;padding:0}

  .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
  .strip{position:absolute;left:0;right:0;top:0;height:32px;

               linear-gradient(#d3e03a,#bccc25);

  .title{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:60px;letter-spacing:-.5px;

  .sub{position:absolute;top:136px;left:0;right:0;text-align:center;font-weight:800;font-size:24px;color:#5a3a2a}

    background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
  .stud{position:absolute;top:-19px;width:50px;height:25px;border-radius:12px 12px 3px 3px;
    background:linear-gradient(90deg,var(--hi),var(--base) 45%,var(--lo));box-shadow:inset 0 3px 0 rgba(255,255,255,.5)}
  .stud:nth-of-type(1){left:22px}.stud:nth-of-type(2){left:91px}.stud:nth-of-type(3){left:160px}
  .card h2{position:relative;z-index:1;font-family:Fredoka,sans-serif;font-weight:700;font-size:42px;line-height:1;text-shadow:0 3px 0 var(--edge)}

<script>
const C = Math.sqrt(3) / 2;
let uid = 0;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* Isometric LEGO brick. L × D studs, H tall (in stud pitches). */
function brick(o) {
  const { L = 4, D = 2, H = 1.2, s = 16, ox = 0, oy = 0, X0 = 0, Y0 = 0, Z0 = 0, color = '#e2301f',
          line = null, lw = 1, studs = true, studIf = null, only = null, hollow = false } = o;
  const pt = (X, Y, Z) => [ox + (X + X0 - Y - Y0) * C * s, oy + (X + X0 + Y + Y0) * 0.5 * s - (Z + Z0) * s];
  const P = (X, Y, Z) => pt(X, Y, Z).map(v => v.toFixed(2)).join(',');
  const la = line ? `stroke="${line}" stroke-width="${lw}" stroke-linejoin="round"` : '';
  const poly = (pts, fill) => `<polygon points="${pts.map(p => P(...p)).join(' ')}" fill="${fill}" ${la}/>`;
  const id = 'b' + (++uid);
  let out = `<defs>
    <linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(color, .06)}"/><stop offset="1" stop-color="${shade(color, -.1)}"/></linearGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(color, -.2)}"/><stop offset="1" stop-color="${shade(color, -.34)}"/></linearGradient>
    <linearGradient id="${id}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(color, .34)}"/><stop offset="1" stop-color="${shade(color, .16)}"/></linearGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${shade(color, .2)}"/><stop offset=".45" stop-color="${shade(color, .02)}"/><stop offset="1" stop-color="${shade(color, -.3)}"/></linearGradient>
  </defs>`;

  const cyl = (X, Y, Zb, Zt, r, topFill, hole) => {
    const [cx, cyb] = pt(X, Y, Zb), [, cyt] = pt(X, Y, Zt);
    const rx = r * s * 1.2247, ry = r * s * 0.7071;
    let g = `<ellipse cx="${cx}" cy="${cyb}" rx="${rx}" ry="${ry}" fill="${shade(color, -.3)}" ${la}/>
      <rect x="${cx - rx}" y="${cyt}" width="${2 * rx}" height="${cyb - cyt}" fill="url(#${id}s)"/>`;
    if (line) g += `<path d="M${cx - rx} ${cyt}V${cyb}M${cx + rx} ${cyt}V${cyb}" stroke="${line}" stroke-width="${lw}"/>`;
    g += `<ellipse cx="${cx}" cy="${cyt}" rx="${rx}" ry="${ry}" fill="${topFill}" ${la}/>`;
    if (hole) g += `<ellipse cx="${cx}" cy="${cyt}" rx="${rx * .72}" ry="${ry * .72}" fill="${shade(color, -.42)}" ${la}/>`;
    else g += `<ellipse cx="${cx - rx * .28}" cy="${cyt - ry * .15}" rx="${rx * .42}" ry="${ry * .34}" fill="#fff" opacity=".4"/>`;
    return g;
  };

  if (only !== 'studs') {
    out += poly([[0, D, 0], [L, D, 0], [L, D, H], [0, D, H]], `url(#${id}l)`);
    out += poly([[L, 0, 0], [L, D, 0], [L, D, H], [L, 0, H]], `url(#${id}r)`);
    out += poly([[0, 0, H], [L, 0, H], [L, D, H], [0, D, H]], `url(#${id}t)`);
    if (!line) out += `<polyline points="${P(0, D, H)} ${P(L, D, H)} ${P(L, 0, H)}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="${Math.max(1, s * .07)}" stroke-linejoin="round"/>`;
    if (hollow) {
      const w = .16, f = .3;
      const op = [[w, w, H], [L - w, w, H], [L - w, D - w, H], [w, D - w, H]];
      out += `<clipPath id="${id}c"><polygon points="${op.map(p => P(...p)).join(' ')}"/></clipPath>`;
      out += poly(op, shade(color, -.3));
      let inner = poly([[w, w, f], [L - w, w, f], [L - w, D - w, f], [w, D - w, f]], shade(color, -.28));
      inner += poly([[w, w, f], [w, D - w, f], [w, D - w, H], [w, w, H]], shade(color, -.1));
      inner += poly([[w, w, f], [L - w, w, f], [L - w, w, H], [w, w, H]], shade(color, -.18));
      for (let X = 1; X < L; X++) inner += cyl(X, D / 2, f, H, .4, shade(color, .3), true);
      out += `<g clip-path="url(#${id}c)">${inner}</g>`;
    }
  }
  if (studs && !hollow && only !== 'body') {
    const list = [];
    for (let i = 0; i < L; i++) for (let j = 0; j < D; j++) list.push([i + .5, j + .5]);
    list.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
    for (const [X, Y] of list) if (!studIf || studIf(X, Y)) out += cyl(X, Y, H, H + .18, .3, `url(#${id}t)`, false);
  }
  return out;
}

function star(x, y, r, fill = '#fff') {
  return `<path d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z" fill="${fill}"/>`;
}

const $ = id => document.getElementById(id);

/* held brick */
$('held').innerHTML = brick({ s: 17, ox: 330, oy: 170, color: '#e2301f' });

/* corner bricks */
$('corner').innerHTML = `<g transform="rotate(8 70 60)">` +
  brick({ s: 15, ox: 56, oy: 56, color: '#9fd12a', studIf: X => X < 2 }) +
  brick({ s: 15, ox: 56, oy: 56, X0: -2, Z0: 1.2, L: 4, D: 2, color: '#e2301f' }) +
  brick({ s: 15, ox: 56, oy: 56, color: '#9fd12a', only: 'studs', studIf: X => X >= 2 }) + `</g>` +
  star(122, 22, 9) + star(10, 96, 6);

/* Quality: red brick snapped onto blue */
$('ic1').innerHTML =
  `<ellipse cx="128" cy="138" rx="80" ry="10" fill="#7a5a00" opacity=".18"/>` +
  brick({ s: 17, ox: 118, oy: 82, color: '#4a3fe0', studIf: X => X < 2 }) +
  brick({ s: 17, ox: 118, oy: 82, X0: -2, Z0: 1.2, color: '#e8401f' }) +
  brick({ s: 17, ox: 118, oy: 82, color: '#4a3fe0', only: 'studs', studIf: X => X >= 2 }) +
  `<g stroke="#e8401f" stroke-width="5" stroke-linecap="round"><line x1="196" y1="40" x2="210" y2="28"/><line x1="204" y1="58" x2="222" y2="56"/><line x1="184" y1="28" x2="188" y2="12"/></g>`;

/* Durability: castle on a baseplate */
(() => {
  const s = 11, ox = 104, oy = 50, grey = '#c3c8cf', dark = '#a9b0b9';
  const B = o => brick(Object.assign({ s, ox, oy }, o));
  let g = `<ellipse cx="128" cy="140" rx="96" ry="9" fill="#5a1000" opacity=".22"/>`;
  g += B({ L: 9, D: 6, H: .35, color: '#58b83a' });
  const zb = .35;
  // left tower
  for (let k = 0; k < 3; k++) g += B({ L: 2, D: 2, X0: 1, Y0: 1, Z0: zb + k * 1.2, color: k % 2 ? dark : grey, studs: k === 2 });
  // wall
  for (let k = 0; k < 2; k++) g += B({ L: 3, D: 1, X0: 3, Y0: 2, Z0: zb + k * 1.2, color: k % 2 ? dark : grey, studs: k === 1 });
  // right tower
  for (let k = 0; k < 3; k++) g += B({ L: 2, D: 2, X0: 6, Y0: 1, Z0: zb + k * 1.2, color: k % 2 ? dark : grey, studs: k === 2 });
  // crenellations
  const top3 = zb + 3.6, top2 = zb + 2.4;
  [[1, 1, top3], [3, 2, top2], [5, 2, top2], [2, 2, top3], [6, 1, top3], [7, 2, top3]]
    .sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]))
    .forEach(([X, Y, Z]) => g += B({ L: 1, D: 1, X0: X, Y0: Y, Z0: Z, color: grey }));
  // door + windows on front faces
  const pt = (X, Y, Z) => [ox + (X - Y) * C * s, oy + (X + Y) * .5 * s - Z * s];
  const a = pt(4, 3, zb), b = pt(5, 3, zb), c = pt(5, 3, zb + 1.3), d = pt(4, 3, zb + 1.3), q = pt(4.5, 3, zb + 2.2);
  g += `<path d="M${a} L${b} L${c} Q${q} ${d} Z" fill="#7a4520" stroke="#5a3012" stroke-width="1.2"/>`;
  const win = (X, Y, Z) => { const p1 = pt(X, Y, Z), p2 = pt(X + .4, Y, Z), p3 = pt(X + .4, Y, Z + .9), p4 = pt(X, Y, Z + .9);
    return `<polygon points="${p1} ${p2} ${p3} ${p4}" fill="#4a5560"/>`; };
  g += win(1.8, 3, zb + 1.6) + win(6.8, 3, zb + 1.6);
  // flag
  const f0 = pt(7, 2, top3 + .2), f1 = pt(7, 2, top3 + 2.6);
  g += `<line x1="${f0[0]}" y1="${f0[1]}" x2="${f1[0]}" y2="${f1[1]}" stroke="#6b4a2b" stroke-width="2.5" stroke-linecap="round"/>`;
  g += `<path d="M${f1[0]} ${f1[1]} L${f1[0] + 24} ${f1[1] + 7} L${f1[0]} ${f1[1] + 14} Z" fill="#ffd21f" stroke="#e0a800" stroke-width="1"/>`;
  g += star(40, 30, 7) + star(206, 64, 5);
  $('ic2').innerHTML = g;
})();

(() => {
  const p = $('progress'), n = 10;
  for (let i = 0; i < n; i++) {
